openapi: 3.1.0
info:
  title: Postmortem Machine API
  description: API for incident ingestion, failure pattern extraction, and vulnerability audits.
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: postmortem-machine-server

  /api/v1/incidents:
    get:
      summary: List ingested incident reports
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: tag
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A list of incidents
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Incident'
                  total:
                    type: integer
    post:
      summary: Ingest a new postmortem report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestIncidentRequest'
      responses:
        '202':
          description: Incident accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'

  /api/v1/incidents/{id}:
    get:
      summary: Get details of an incident report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Incident details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '404':
          description: Incident not found

  /api/v1/patterns:
    get:
      summary: List detected failure patterns
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of failure patterns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FailurePattern'

  /api/v1/audit/checklists:
    get:
      summary: Get vulnerability checklists for systemic failure patterns
      parameters:
        - name: pattern_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Vulnerability audit checklist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditChecklistItem'

components:
  schemas:
    Incident:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        source_url:
          type: string
        published_at:
          type: string
          format: date-time
        summary:
          type: string
        status:
          type: string
          enum: [pending, processing, classified, reviewed]
        created_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - status

    IngestIncidentRequest:
      type: object
      properties:
        title:
          type: string
        source_url:
          type: string
        content:
          type: string
        raw_format:
          type: string
          enum: [markdown, text, html]
      required:
        - title
        - content

    FailurePattern:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        description:
          type: string
        incident_count:
          type: integer
        mitigation_strategy:
          type: string
      required:
        - id
        - name
        - category
        - incident_count

    AuditChecklistItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pattern_id:
          type: string
          format: uuid
        question:
          type: string
        risk_level:
          type: string
          enum: [low, medium, high, critical]
        verification_steps:
          type: array
          items:
            type: string
      required:
        - id
        - pattern_id
        - question
        - risk_level
