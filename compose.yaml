name: tm3l-postmortem-machine

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postmortem-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postmortem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postmortem_secret}
      POSTGRES_DB: ${POSTGRES_DB:-postmortem_dev}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postmortem} -d ${POSTGRES_DB:-postmortem_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: postmortem-pb
    ports:
      - "8093:8090"
    volumes:
      - pb_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  server:
    build:
      context: ./server
      dockerfile: ../deploy/Dockerfile.server
    container_name: postmortem-server
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postmortem}:${POSTGRES_PASSWORD:-postmortem_secret}@postgres:5432/${POSTGRES_DB:-postmortem_dev}?sslmode=disable"
      POCKETBASE_URL: "http://pocketbase:8090"
      ENV: "development"
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      pocketbase:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  jobs:
    build:
      context: ./jobs
      dockerfile: ../deploy/Dockerfile.jobs
    container_name: postmortem-nlp-jobs
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postmortem}:${POSTGRES_PASSWORD:-postmortem_secret}@postgres:5432/${POSTGRES_DB:-postmortem_dev}?sslmode=disable"
      POCKETBASE_URL: "http://pocketbase:8090"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M

  explorer:
    build:
      context: ./explorer
    container_name: postmortem-explorer
    environment:
      VITE_API_URL: "http://localhost:8083"
      VITE_PB_URL: "http://localhost:8093"
    ports:
      - "5175:5173"
    volumes:
      - ./explorer:/app
      - /app/node_modules
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  postgres_data:
  pb_data:
